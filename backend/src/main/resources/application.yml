server:
  port: 8899


spring:
  application:
    name: search_engine
#  elasticsearch:
#    uris: localhost:9200
#    connection-timeout: 1s
#    socket-timeout: 30s
  redis:
    # Redis 服务器地址
    host: localhost
    # 连接端口号
    port: 6379
    # 数据库索引（0 - 15）
    database: 0
    # 连接超时时间（毫秒）
    timeout: 100000
    # lettuce 参数
    lettuce:
      pool:
        # 最大连接数(使用负值表示没有限制) 默认为 8
        max-active: 10
        # 最大阻塞等待时间(使用负值表示没有限制) 默认为 -1 ms
        max-wait: -1
        # 最大空闲连接 默认为 8
        max-idle: 5
        # 最小空闲连接 默认为 0
        min-idle: 0

  data:
    mongodb:
      uri: mongodb://localhost:27017/ARC_ENGINE
#      uri: mongodb://43.139.102.107:27017/ARC_ENGINE
